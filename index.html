<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Racing Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: #000;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
        }
        
        #loading-screen h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
        
        .progress-container {
            width: 400px;
            height: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #00ff88);
            transition: width 0.3s ease;
        }
        
        #loading-text {
            font-size: 1.2em;
            color: #aaa;
        }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 1.2em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 100;
            pointer-events: none;
        }
        
        .hud-item {
            margin: 10px 0;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            border-left: 4px solid #00ffff;
        }
        
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 0.9em;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            z-index: 100;
            pointer-events: none;
        }
        
        #minimap {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ffff;
            border-radius: 10px;
            z-index: 100;
        }
        
        #start-button {
            margin-top: 30px;
            padding: 15px 50px;
            font-size: 1.5em;
            background: linear-gradient(135deg, #00ffff, #00ff88);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            color: #1a1a2e;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            display: none;
        }
        
        #start-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }
        
        .key {
            display: inline-block;
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            margin: 2px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading-screen">
            <h1>🏁 3D RACING GAME 🏁</h1>
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
            <div id="loading-text">Loading assets...</div>
            <button id="start-button">START RACE</button>
        </div>
        
        <div id="hud" style="display: none;">
            <div class="hud-item">Position: <span id="position">1/5</span></div>
            <div class="hud-item">Lap: <span id="lap">1/3</span></div>
            <div class="hud-item">Time: <span id="time">0:00.00</span></div>
            <div class="hud-item">Speed: <span id="speed">0</span> km/h</div>
        </div>
        
        <div id="controls-hint" style="display: none;">
            <div><span class="key">↑</span> or <span class="key">W</span> - Accelerate</div>
            <div><span class="key">↓</span> or <span class="key">S</span> - Brake</div>
            <div><span class="key">←</span> or <span class="key">A</span> - Turn Left</div>
            <div><span class="key">→</span> or <span class="key">D</span> - Turn Right</div>
            <div><span class="key">R</span> - Reset Position</div>
        </div>
        
        <canvas id="minimap"></canvas>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        
        // Setup DRACOLoader for compressed GLB files
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/gltf/');
        
        // Game state
        const gameState = {
            loaded: false,
            playing: false,
            playerCar: null,
            track: null,
            bots: [],
            cameras: {},
            clock: new THREE.Clock(),
            startTime: 0,
            lap: 1,
            maxLaps: 3,
            position: 1,
            totalRacers: 5,
            trackWaypoints: [],
            trackBounds: null
        };
        
        // Player controls
        const controls = {
            accelerate: false,
            brake: false,
            turnLeft: false,
            turnRight: false
        };
        
        // Physics constants
        const PHYSICS = {
            maxSpeed: 200,
            acceleration: 80,
            braking: 120,
            friction: 30,
            turnSpeed: 2.5,
            offRoadSlowdown: 0.3
        };
        
        // Scene setup
        let scene, camera, renderer;
        let playerVelocity = 0;
        let playerSteering = 0;
        
        function init() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 100, 500);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('game-container').appendChild(renderer.domElement);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(50, 100, 50);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 500;
            directionalLight.shadow.camera.left = -100;
            directionalLight.shadow.camera.right = 100;
            directionalLight.shadow.camera.top = 100;
            directionalLight.shadow.camera.bottom = -100;
            scene.add(directionalLight);
            
            // Handle resize
            window.addEventListener('resize', onWindowResize);
            
            // Setup controls
            setupControls();
            
            // Load assets
            loadAssets();
        }
        
        function setupControls() {
            document.addEventListener('keydown', (e) => {
                switch(e.key.toLowerCase()) {
                    case 'arrowup':
                    case 'w':
                        controls.accelerate = true;
                        break;
                    case 'arrowdown':
                    case 's':
                        controls.brake = true;
                        break;
                    case 'arrowleft':
                    case 'a':
                        controls.turnLeft = true;
                        break;
                    case 'arrowright':
                    case 'd':
                        controls.turnRight = true;
                        break;
                    case 'r':
                        resetPlayerPosition();
                        break;
                }
            });
            
            document.addEventListener('keyup', (e) => {
                switch(e.key.toLowerCase()) {
                    case 'arrowup':
                    case 'w':
                        controls.accelerate = false;
                        break;
                    case 'arrowdown':
                    case 's':
                        controls.brake = false;
                        break;
                    case 'arrowleft':
                    case 'a':
                        controls.turnLeft = false;
                        break;
                    case 'arrowright':
                    case 'd':
                        controls.turnRight = false;
                        break;
                }
            });
            
            document.getElementById('start-button').addEventListener('click', startGame);
        }
        
        function loadAssets() {
            const loader = new GLTFLoader();
            loader.setDRACOLoader(dracoLoader);
            let loadedCount = 0;
            const totalAssets = 2;
            
            const updateProgress = () => {
                loadedCount++;
                const progress = (loadedCount / totalAssets) * 100;
                document.getElementById('progress-bar').style.width = `${progress}%`;
                
                if (loadedCount === totalAssets) {
                    gameState.loaded = true;
                    document.getElementById('loading-text').textContent = 'Ready to Race!';
                    document.getElementById('start-button').style.display = 'block';
                    analyzeTrack();
                }
            };
            
            // Load track
            loader.load('shanghai.glb', (gltf) => {
                gameState.track = gltf.scene;
                gameState.track.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                scene.add(gameState.track);
                console.log('Track loaded successfully');
                updateProgress();
            }, 
            (xhr) => {
                const percent = (xhr.loaded / xhr.total) * 100;
                console.log(`Track loading: ${percent.toFixed(0)}%`);
            },
            (error) => {
                console.error('Error loading track:', error);
                document.getElementById('loading-text').textContent = 'Error loading track!';
            });
            
            // Load car
            loader.load('3d_car.glb', (gltf) => {
                gameState.playerCar = gltf.scene;
                gameState.playerCar.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                scene.add(gameState.playerCar);
                gameState.playerCar.visible = false;
                console.log('Car loaded successfully');
                updateProgress();
            },
            (xhr) => {
                const percent = (xhr.loaded / xhr.total) * 100;
                console.log(`Car loading: ${percent.toFixed(0)}%`);
            },
            (error) => {
                console.error('Error loading car:', error);
                document.getElementById('loading-text').textContent = 'Error loading car!';
            });
        }
        
        function analyzeTrack() {
            // Analyze track to find driving line and boundaries
            if (!gameState.track) return;
            
            const boundingBox = new THREE.Box3().setFromObject(gameState.track);
            gameState.trackBounds = boundingBox;
            
            // Generate waypoints by sampling the track surface
            const center = new THREE.Vector3();
            boundingBox.getCenter(center);
            
            // Create circular waypoint system for the track
            const numWaypoints = 50;
            const radius = Math.max(boundingBox.getSize(new THREE.Vector3()).x, boundingBox.getSize(new THREE.Vector3()).z) * 0.4;
            
            for (let i = 0; i < numWaypoints; i++) {
                const angle = (i / numWaypoints) * Math.PI * 2;
                const waypoint = new THREE.Vector3(
                    center.x + Math.cos(angle) * radius,
                    center.y + 1,
                    center.z + Math.sin(angle) * radius
                );
                gameState.trackWaypoints.push(waypoint);
            }
            
            console.log('Track analyzed:', gameState.trackWaypoints.length, 'waypoints generated');
        }
        
        function startGame() {
            if (!gameState.loaded) return;
            
            // Hide loading screen
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('controls-hint').style.display = 'block';
            
            // Position player car at starting line
            if (gameState.playerCar && gameState.trackWaypoints.length > 0) {
                const startPos = gameState.trackWaypoints[0].clone();
                gameState.playerCar.position.copy(startPos);
                gameState.playerCar.rotation.set(0, 0, 0);
                gameState.playerCar.visible = true;
                
                // Orient car towards next waypoint
                if (gameState.trackWaypoints[1]) {
                    gameState.playerCar.lookAt(gameState.trackWaypoints[1]);
                }
            }
            
            // Create bot cars
            createBots();
            
            // Start game
            gameState.playing = true;
            gameState.startTime = Date.now();
            gameState.clock.start();
            
            // Start game loop
            animate();
        }
        
        function createBots() {
            const botColors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00];
            
            for (let i = 0; i < 4; i++) {
                // Create simple bot car mesh
                const botGeometry = new THREE.BoxGeometry(2, 1, 4);
                const botMaterial = new THREE.MeshStandardMaterial({ 
                    color: botColors[i],
                    metalness: 0.7,
                    roughness: 0.3
                });
                const botMesh = new THREE.Mesh(botGeometry, botMaterial);
                
                // Position bots at starting grid
                if (gameState.trackWaypoints.length > 0) {
                    const startPos = gameState.trackWaypoints[0].clone();
                    startPos.x += (i + 1) * 3;
                    botMesh.position.copy(startPos);
                    
                    if (gameState.trackWaypoints[1]) {
                        botMesh.lookAt(gameState.trackWaypoints[1].clone().add(new THREE.Vector3((i + 1) * 3, 0, 0)));
                    }
                }
                
                scene.add(botMesh);
                
                // Bot state
                gameState.bots.push({
                    mesh: botMesh,
                    currentWaypoint: 0,
                    speed: 0,
                    maxSpeed: PHYSICS.maxSpeed * (0.85 + Math.random() * 0.1),
                    lap: 1,
                    finished: false
                });
            }
        }
        
        function updatePlayer(delta) {
            if (!gameState.playerCar) return;
            
            // Acceleration
            if (controls.accelerate) {
                playerVelocity += PHYSICS.acceleration * delta;
            } else if (controls.brake) {
                playerVelocity -= PHYSICS.braking * delta;
            } else {
                // Friction
                if (playerVelocity > 0) {
                    playerVelocity -= PHYSICS.friction * delta;
                    if (playerVelocity < 0) playerVelocity = 0;
                } else if (playerVelocity < 0) {
                    playerVelocity += PHYSICS.friction * delta;
                    if (playerVelocity > 0) playerVelocity = 0;
                }
            }
            
            // Clamp speed
            playerVelocity = Math.max(-PHYSICS.maxSpeed / 2, Math.min(PHYSICS.maxSpeed, playerVelocity));
            
            // Steering
            let steering = 0;
            if (Math.abs(playerVelocity) > 1) {
                if (controls.turnLeft) steering = 1;
                if (controls.turnRight) steering = -1;
            }
            
            // Apply steering (reverse when going backwards)
            if (playerVelocity < 0) steering *= -1;
            playerSteering += steering * PHYSICS.turnSpeed * delta;
            playerSteering *= 0.9; // Damping
            
            gameState.playerCar.rotation.y += playerSteering * delta * (playerVelocity / PHYSICS.maxSpeed);
            
            // Move car forward
            const direction = new THREE.Vector3(0, 0, 1);
            direction.applyAxisAngle(new THREE.Vector3(0, 1, 0), gameState.playerCar.rotation.y);
            gameState.playerCar.position.add(direction.multiplyScalar(playerVelocity * delta));
            
            // Check if on track (simple distance check to waypoints)
            checkOnTrack(gameState.playerCar);
            
            // Update camera to follow car
            updateCamera();
            
            // Update HUD
            updateHUD();
        }
        
        function checkOnTrack(car) {
            // Simple track boundary check
            if (!gameState.trackBounds) return;
            
            const pos = car.position;
            const bounds = gameState.trackBounds;
            
            // Add some margin
            const margin = 10;
            if (pos.x < bounds.min.x - margin || pos.x > bounds.max.x + margin ||
                pos.z < bounds.min.z - margin || pos.z > bounds.max.z + margin) {
                // Off track - slow down
                playerVelocity *= PHYSICS.offRoadSlowdown;
            }
        }
        
        function updateCamera() {
            if (!gameState.playerCar) return;
            
            // Third-person camera following the car
            const relativeOffset = new THREE.Vector3(0, 5, -10);
            const cameraOffset = relativeOffset.applyMatrix4(gameState.playerCar.matrixWorld);
            
            camera.position.lerp(cameraOffset, 0.1);
            camera.lookAt(gameState.playerCar.position.clone().add(new THREE.Vector3(0, 2, 0)));
        }
        
        function updateBots(delta) {
            gameState.bots.forEach((bot, index) => {
                if (bot.finished) return;
                
                const targetWaypoint = gameState.trackWaypoints[bot.currentWaypoint];
                if (!targetWaypoint) return;
                
                // Calculate direction to waypoint
                const direction = new THREE.Vector3().subVectors(targetWaypoint, bot.mesh.position);
                const distance = direction.length();
                direction.normalize();
                
                // Steer towards waypoint
                const botDirection = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), bot.mesh.rotation.y);
                const dot = botDirection.dot(direction);
                
                if (dot < 0.9) {
                    const cross = botDirection.cross(direction).y;
                    bot.mesh.rotation.y += Math.sign(cross) * 2 * delta;
                }
                
                // Accelerate to max speed
                bot.speed += PHYSICS.acceleration * 0.8 * delta;
                bot.speed = Math.min(bot.maxSpeed, bot.speed);
                
                // Move bot
                bot.mesh.position.add(direction.multiplyScalar(bot.speed * delta));
                
                // Check if reached waypoint
                if (distance < 10) {
                    bot.currentWaypoint = (bot.currentWaypoint + 1) % gameState.trackWaypoints.length;
                    
                    // Lap counting
                    if (bot.currentWaypoint === 0) {
                        bot.lap++;
                        if (bot.lap > gameState.maxLaps) {
                            bot.finished = true;
                        }
                    }
                }
            });
        }
        
        function updateHUD() {
            // Calculate race time
            const elapsed = (Date.now() - gameState.startTime) / 1000;
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('time').textContent = 
                `${minutes}:${seconds.toFixed(2).padStart(5, '0')}`;
            
            // Speed
            document.getElementById('speed').textContent = Math.abs(Math.floor(playerVelocity));
            
            // Position (simplified)
            let playerAhead = 1;
            gameState.bots.forEach(bot => {
                if (bot.lap > gameState.lap || 
                    (bot.lap === gameState.lap && bot.currentWaypoint > 0)) {
                    playerAhead++;
                }
            });
            document.getElementById('position').textContent = `${playerAhead}/${gameState.totalRacers}`;
            gameState.position = playerAhead;
            
            // Lap
            document.getElementById('lap').textContent = `${gameState.lap}/${gameState.maxLaps}`;
        }
        
        function updateMinimap() {
            const canvas = document.getElementById('minimap');
            const ctx = canvas.getContext('2d');
            const size = 200;
            canvas.width = size;
            canvas.height = size;
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, size, size);
            
            if (gameState.trackWaypoints.length === 0) return;
            
            // Calculate bounds
            const minX = Math.min(...gameState.trackWaypoints.map(p => p.x));
            const maxX = Math.max(...gameState.trackWaypoints.map(p => p.x));
            const minZ = Math.min(...gameState.trackWaypoints.map(p => p.z));
            const maxZ = Math.max(...gameState.trackWaypoints.map(p => p.z));
            
            const rangeX = maxX - minX || 1;
            const rangeZ = maxZ - minZ || 1;
            
            // Draw track waypoints
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            gameState.trackWaypoints.forEach((wp, i) => {
                const x = ((wp.x - minX) / rangeX) * (size - 20) + 10;
                const y = ((wp.z - minZ) / rangeZ) * (size - 20) + 10;
                
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            
            ctx.closePath();
            ctx.stroke();
            
            // Draw player
            if (gameState.playerCar) {
                const px = ((gameState.playerCar.position.x - minX) / rangeX) * (size - 20) + 10;
                const py = ((gameState.playerCar.position.z - minZ) / rangeZ) * (size - 20) + 10;
                
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(px, py, 5, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Draw bots
            gameState.bots.forEach((bot, i) => {
                const bx = ((bot.mesh.position.x - minX) / rangeX) * (size - 20) + 10;
                const by = ((bot.mesh.position.z - minZ) / rangeZ) * (size - 20) + 10;
                
                ctx.fillStyle = ['#ff0000', '#00ff00', '#0000ff', '#ffff00'][i];
                ctx.beginPath();
                ctx.arc(bx, by, 4, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        function resetPlayerPosition() {
            if (gameState.trackWaypoints.length > 0 && gameState.playerCar) {
                // Find nearest waypoint
                let nearestIdx = 0;
                let nearestDist = Infinity;
                
                gameState.trackWaypoints.forEach((wp, i) => {
                    const dist = wp.distanceTo(gameState.playerCar.position);
                    if (dist < nearestDist) {
                        nearestDist = dist;
                        nearestIdx = i;
                    }
                });
                
                // Reset to waypoint
                gameState.playerCar.position.copy(gameState.trackWaypoints[nearestIdx]);
                playerVelocity = 0;
                
                // Orient towards next waypoint
                const nextIdx = (nearestIdx + 1) % gameState.trackWaypoints.length;
                gameState.playerCar.lookAt(gameState.trackWaypoints[nextIdx]);
            }
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            if (!gameState.playing) return;
            
            requestAnimationFrame(animate);
            
            const delta = Math.min(gameState.clock.getDelta(), 0.1);
            
            updatePlayer(delta);
            updateBots(delta);
            updateMinimap();
            
            renderer.render(scene, camera);
        }
        
        // Initialize game
        init();
    </script>
</body>
</html>
